[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-diagnosis-simulation"
version = "1.1.0"
description = "Transparent Bayesian CI diagnosis research simulation"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
workbook = ["pandas>=2.2,<3.1", "openpyxl>=3.1,<3.2"]
dev = ["pytest==8.4.2", "ruff==0.13.2", "mypy==1.18.2"]

[project.scripts]
ci-diagnosis = "ci_diagnosis.evaluation:main"
ci-diagnosis-quality = "ci_diagnosis.quality:main"

[tool.setuptools.packages.find]
include = ["ci_diagnosis*"]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["experiments/*evaluation_results.py", "experiments/engineering_quality_results.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["ci_diagnosis"]
strict = true
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["pandas", "openpyxl"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: workbook and notebook integration checks"]

